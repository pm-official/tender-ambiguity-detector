[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tender-ambiguity-detector"
version = "0.1.0"
description = "Tender Ambiguity Detector (TAD) — detects 8 categories of ambiguity in Indian construction tender PDFs"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.black]
line-length = 110
target-version = ["py311"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
