overview:
  title: "Annotation protocol (LLM-as-Judge + human spot-check)"
  what: "A semi-automated gold-set construction that uses three-seed LLM-as-judge majority vote plus targeted human spot-check to avoid requiring a full second annotator."
  why: "A defensible gold set is required for precision/recall claims. Full double-annotation is infeasible in thesis timelines; this protocol is the mitigation."
  how: "Phases 1–7 below; document fully in the paper's Annotation section."
  benchmark: "On a 50-flag subset with a human second annotator, kappa ≥ 0.70 is the target."
  example: ""
phase_1_recall_sweep:
  title: "Phase 1 — Recall sweep"
  what: "Run detector at threshold 0.2 and agreement ≥ 1/3 across all 8 categories to produce a high-recall candidate set C₁."
  why: "Start by catching everything plausible; precision filtering happens downstream."
  how: "detector.detect() with relaxed thresholds."
  benchmark: ""
  example: ""
phase_2_judge:
  title: "Phase 2 — Judge pass"
  what: "For each candidate, call Gemini 2.5 Pro with prompts/llm_judge_annotation.txt three times. Majority vote decides."
  why: "Three runs mitigate single-shot errors; majority is more robust than any single run."
  how: "prompts/llm_judge_annotation.txt; seeds implemented by prompt paraphrasing."
  benchmark: "~90% of candidates decide at 3/3 or 2/3; ~10% go UNCERTAIN."
  example: ""
phase_3_filter:
  title: "Phase 3 — Filter"
  what: "Keep TRUE_POSITIVE; re-route WRONG_CATEGORY to the correct category; bucket FALSE_POSITIVE / UNCERTAIN for human spot-check."
  why: "Structure the human review to be minimal but targeted."
  how: "src/annotation_protocol.py."
  benchmark: ""
  example: ""
phase_4_recall_audit:
  title: "Phase 4 — Recall audit"
  what: "Independent open-ended reader flags ambiguities in each clause; flags found by the reader but not in Phase-3 are 'missed recall candidates'."
  why: "Catches false negatives that the detector never surfaced."
  how: "Single Gemini 2.5 Pro call per clause with the open-ended prompt."
  benchmark: ""
  example: ""
phase_5_human:
  title: "Phase 5 — Human spot-check (by you)"
  what: "Review 20% of TRUE_POSITIVE (stratified), 100% of UNCERTAIN, 100% of missed-recall, 100% of across-seed disagreements."
  why: "Your judgement is the ground truth on the least-certain and highest-risk subset."
  how: "Via the Annotate tab."
  benchmark: ""
  example: ""
phase_6_emit:
  title: "Phase 6 — Emit gold file"
  what: "Merge (Phase 3 TRUE_POSITIVE) \\ (spot-check rejections) ∪ (spot-check additions)."
  why: "Deterministic gold-set construction, reproducible from the artifacts."
  how: "Write output/gold/gold_{timestamp}.csv."
  benchmark: ""
  example: ""
phase_7_iaa:
  title: "Phase 7 — IAA (if second annotator available)"
  what: "Compute Cohen's kappa on a 50-flag blind sample."
  why: "External validity anchor; makes the protocol defensible to reviewers."
  how: "src/iaa.py."
  benchmark: "kappa ≥ 0.70 target."
  example: ""
