keyword_score:
  title: "Keyword score"
  what: "Probability, in [0,1], that the curated lexicon for this category matches the chunk."
  why: "Keyword scores are fast, transparent, and cheap. High keyword scores explain *why* a flag fired: a matched term is a concrete reason a bidder might dispute the clause."
  how: "For each matching term, add its lexicon weight; normalise by (tokens / 100); cap at 1.0. Optional context rules (requires_noun_after, forbid_numeric_nearby) filter spurious matches."
  benchmark: "For well-curated lexicons, healthy per-chunk peak ~0.5-0.9. Very high keyword-only scores with low LLM scores suggest the lexicon needs a forbid rule."
  example: "'provide adequate drainage'. 'adequate' weight 0.9 fires, tokens=4, normalised = 0.9 / max(1, 0.04) → capped at 1.0, but capped again at 1.0 per-chunk for UI stability."
llm_score:
  title: "LLM score"
  what: "Single Gemini 2.5 Flash call per chunk per category — the model scores the probability of the category being present, from 0 to 1."
  why: "Covers phrasings the lexicon cannot anticipate — paraphrases, complex constructions, implicit references."
  how: "Prompt at prompts/detection_score_{category_id}.txt. The model also returns the span it considers problematic and a one-sentence justification, which the UI shows."
  benchmark: "0.3-0.5 typical for borderline cases; ≥0.7 for clear positives."
  example: "'The contractor shall work in a workmanlike manner'. LLM flags 'workmanlike manner' as Vague Qualifiers with score 0.82."
combined_score:
  title: "Combined score"
  what: "α·keyword + (1-α)·llm, where α is the keyword weight (default 0.3 → LLM-dominant)."
  why: "Combines the two signals into one decision number. Both scores are shown separately so the user can see where the signal came from."
  how: "Computed in src/detector.detect_dual. α is configurable in the sidebar."
  benchmark: "Flag emitted when combined ≥ DETECTION_THRESHOLD (default 0.5, per-category after calibration)."
  example: "kw=0.9, llm=0.4, α=0.3 → combined = 0.3·0.9 + 0.7·0.4 = 0.55 → flagged."
detection_threshold:
  title: "Detection threshold"
  what: "Minimum combined score for a chunk to be confirmed as a flag."
  why: "Per-category thresholds are calibration-tuned because categories differ in noise floor."
  how: "Default 0.5. Calibration sweep (src/experiments.py) finds the per-category threshold maximising F1 on the held-out gold slice; results go to output/calibration.json."
  benchmark: "Typical post-calibration range 0.40-0.65."
  example: "Vague Qualifiers calibrated to 0.55 on one tender, 0.48 on another depending on clause style."
alpha:
  title: "α — keyword vs LLM weight"
  what: "The weight of the keyword score in the combined score; (1-α) is the LLM weight."
  why: "Controls the blend between cheap keyword signal and more expressive LLM signal. Default 0.3 is LLM-dominant."
  how: "Sidebar slider in the Analyse tab; also sweeps via the alpha_sweep ablation."
  benchmark: "0.3 is the default we ship; extremes 0.0 and 1.0 are mostly for diagnostic ablations."
  example: "α=0.0 → keyword-agnostic; α=1.0 → keyword-only; α=0.3 → 70% LLM + 30% keyword."
