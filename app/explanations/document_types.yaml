GCC:
  title: "GCC — General Conditions of Contract"
  what: "Standard commercial and legal clauses that apply to the whole contract — scope, payment, dispute resolution, termination."
  why: "Most Priority Conflicts are asserted here. GCCs are typically boilerplate adopted by the agency (e.g. CPWD GCC)."
  how: ""
  benchmark: ""
  example: "CPWD's General Conditions of Contract."
Additional Conditions:
  title: "Additional Conditions"
  what: "Tender-specific commercial/legal amendments or additions to the GCC."
  why: "Priority Conflicts frequently arise between the GCC and Additional Conditions on the same clause."
  how: ""
  benchmark: ""
  example: "Additional Conditions of Contract — project-specific clauses on advance payment, escalation, penalty rates."
NIT:
  title: "NIT — Notice Inviting Tender"
  what: "The formal invitation announcing the tender, eligibility, bid submission details, earnest money deposit."
  why: "Contains bid-critical dates and eligibility criteria; rarely the source of ambiguity but indexed for completeness."
  how: ""
  benchmark: ""
  example: "Works Department NIT No. XYZ/2026."
Technical Specifications:
  title: "Technical Specifications"
  what: "Material, workmanship, and testing specifications for every item of work."
  why: "The primary source for most Unnamed References, Incomplete Specifications, and Undefined Terms flags."
  how: ""
  benchmark: ""
  example: "Particular Specifications, Technical Specifications, Special Conditions (Technical)."
BOQ:
  title: "BOQ — Bill of Quantities"
  what: "Priced schedule of items with quantities and unit rates."
  why: "Cross-references with Specifications/Drawings are where Numerical Inconsistencies surface."
  how: ""
  benchmark: ""
  example: "Schedule A, Bill of Quantities, Schedule of Rates."
Conditions of Contract:
  title: "Conditions of Contract (unspecified)"
  what: "A document labelled 'Conditions of Contract' that is not clearly GCC or Additional Conditions."
  why: ""
  how: ""
  benchmark: ""
  example: ""
Addendum:
  title: "Addendum / Corrigendum"
  what: "Post-issue amendments or clarifications to the tender documents."
  why: "Addenda sometimes resolve Stage-1 ambiguities; Stage 2 must see them to avoid false Confirmed Ambiguous flags."
  how: ""
  benchmark: ""
  example: "Corrigendum No. 1 dated 2026-03-15."
Drawing:
  title: "Drawing"
  what: "Architectural / structural / MEP drawings."
  why: "Drawings are frequently referenced by text (I-category); Numerical Inconsistencies between BOQ and Drawings are a classic H-category case."
  how: ""
  benchmark: ""
  example: "DWG-ARCH-04, Structural GA Drawing."
Other:
  title: "Other"
  what: "Any document not fitting the standard categories (photos, forms, brochures, tender response templates)."
  why: "Indexed for retrieval but unlikely to be the ambiguity source."
  how: ""
  benchmark: ""
  example: ""
