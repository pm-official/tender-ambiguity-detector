# Prompt-4 four-stage methodology
parse:
  title: "Stage 0a — Parse"
  what: "Extract text from every PDF in the tender package, page by page."
  why: "All downstream stages depend on clean text; parsing errors propagate."
  how: "pymupdf (fitz) per-page text extraction. Scanned PDFs without an OCR layer are unsupported in this build."
  benchmark: "~99% coverage on modern searchable tenders."
  example: "10 PDFs × 20 pages → 200 ParsedPage objects."
chunk:
  title: "Stage 0b — Clause-aware chunking"
  what: "Break each page along clause markers (4.1.2, Clause 12, (a)) and pack into ~500-token chunks, respecting any user-supplied page ranges."
  why: "Clause-aligned chunks keep each flag readable and traceable back to a specific clause."
  how: "Regex-based clause split + greedy packing with 50-token overlap; chunks outside the selected page range are dropped."
  benchmark: "A typical Indian construction tender yields 60-120 chunks per document."
  example: "'4.1 Scope of work...' becomes a chunk with clause_hint='4.1 Scope of work'."
index_package:
  title: "Stage 0c — Index package"
  what: "Embed every chunk from every uploaded document into the tender-package vector store, with package_id + document_type metadata."
  why: "Stage 2 retrieves across the whole package — even from documents the user did not select for flag generation — because a disambiguating definition often lives in a document the user isn't focused on."
  how: "text-embedding-004 per chunk with cosine similarity; upserted into the tender_package_chunks collection."
  benchmark: "~100 chunks/s at typical quota."
  example: "Chunks from BOQ + Drawings + GCC all go into the same package_id."
graph:
  title: "Stage 0d — Build knowledge graph"
  what: "Extract documents, clauses, entities, named quantities, and priority rules from the selected chunks; assemble a NetworkX graph."
  why: "Priority Conflicts and Numerical Inconsistencies are inherently cross-document; vector retrieval cannot see them."
  how: "LLM entity/quantity/priority extraction per chunk; canonicalisation via surface-form aliasing; typed nodes and edges."
  benchmark: "Graph retrieval recall for G/H tracks with priority-rule-extraction quality."
  example: "'GCC section 5 shall prevail over drawings' → PriorityRule node with dominant=GCC, subordinate=drawings."
detect:
  title: "Stage 1 — Dual-scoring detection"
  what: "For each candidate chunk and each enabled category, compute a keyword score (from the lexicon) and an LLM score (single Gemini Flash call). combined = α·keyword + (1-α)·llm; flag if combined >= threshold."
  why: "Cheaper, faster, and easier to explain than a 3-pass ensemble — and just as accurate in our ablation."
  how: "Lexicons live in data/keywords/{category_id}.yaml. LLM prompts live in prompts/detection_score_{category_id}.txt. An optional negative-control probe post-processes to downgrade confidence on disagreement."
  benchmark: "Default α=0.3 (LLM-dominant) and threshold=0.5; both tunable per-category via calibration."
  example: "chunk 'provide adequate drainage'. keyword=0.9 (adequate matches), llm=0.85 → combined=0.87 → flagged as Vague Qualifiers."
resolve:
  title: "Stage 2 — Package context resolution"
  what: "For each flagged chunk, retrieve top-k context from the whole tender package and ask the adjudicator whether the rest of the package resolves the flag."
  why: "Many flags look ambiguous in isolation but a different document in the same package defines the term. Stage 2 separates 'Confirmed Ambiguous' from 'Resolved by Context'."
  how: "Package-wide vector retrieval for local categories; graph retrieval for Priority Conflicts and Numerical Inconsistencies. Adjudicator uses prompts/resolution_package.txt."
  benchmark: "In a well-written package, 25-45% of Stage-1 flags resolve at Stage 2."
  example: "'apply primer' flag + a retrieved spec section describing the exact primer type, DFT, and cure → Resolved by Context."
judge_citations:
  title: "Stage 2 — LLM-as-judge citation verification (G3)"
  what: "A second LLM pass verifies that every cited context id actually appears in the retrieved block, and that the citation substantively supports the reasoning."
  why: "Adjudicator citation hallucination is the leading cause of false Resolved verdicts. The judge breaks that failure mode."
  how: "prompts/llm_judge_citation.txt, temperature 0. Strips fabricated citations; triggers a stricter re-adjudication if the reasoning collapses."
  benchmark: "Fabrication rate usually 5-15%."
  example: "Adjudicator cites ctx_7; present → kept. Cites ctx_22; absent → stripped."
rewrite:
  title: "Stage 3 — Standards-grounded rewrite"
  what: "For Confirmed Ambiguous (and optionally Partially Resolved) flags, produce a rewrite grounded in IS-code and CPWD standards."
  why: "Gives the user a concrete replacement to propose in a clarification — not 'fix this'."
  how: "Gemini 2.5 Pro with prompts/rewrite_standards.txt. The grounding block contains a labelled tender-context block and a labelled standards block; only standards may be cited as the authoritative source."
  benchmark: "INSUFFICIENT_GROUNDING is emitted honestly when no standards anchor exists."
  example: "'apply primer' + retrieved IS 15546 section → 'Apply zinc-chromate primer (IS 15546:2024), 40 um DFT, 4 hr cure.'"
verify_grounding:
  title: "Stage 3 — Grounding verification (G4)"
  what: "Strips any IS-code or CPWD reference in the rewrite that does not appear verbatim in the standards grounding block."
  why: "Prevents fabricated clause numbers — a thesis-integrity risk."
  how: "Regex extract all standards refs in the suggested text; intersect with those in the standards block; strip orphans; downgrade to INSUFFICIENT_GROUNDING if nothing defensible remains."
  benchmark: "Fabrication rate post-verification should be <2%."
  example: "Rewrite mentions 'IS 15546' present → kept; 'IS 999999' absent → stripped."
