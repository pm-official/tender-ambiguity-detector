parse:
  title: "Stage 0a — Parse"
  what: "Extract text from the uploaded PDF(s), page by page."
  why: "Everything downstream depends on clean text; parsing errors propagate."
  how: "pymupdf (fitz) per-page text extraction; a parse_report.json records pages and char counts."
  benchmark: "Modern searchable tender PDFs yield ~99% coverage. Scanned PDFs need OCR — not supported in this build."
  example: "10-page tender → 10 ParsedPage objects with raw text."
chunk:
  title: "Stage 0b — Clause-aware chunking"
  what: "Break each page along clause markers (e.g. 4.1.2, Clause 12, (a)) and pack into ~500-token chunks."
  why: "Clause-aligned chunks keep each flag readable and traceable back to a specific clause."
  how: "Regex-based clause split, then greedy packing with 50-token overlap to preserve context across chunk boundaries."
  benchmark: "Typical tender ~60–120 chunks."
  example: "'4.1 Scope of work. The contractor shall …' becomes one chunk with clause_hint='4.1 Scope of work'."
embed:
  title: "Stage 0c — Embedding index"
  what: "Embed tender chunks (and separately IS-code chunks) into ChromaDB for hybrid retrieval."
  why: "Vector retrieval resolves most local ambiguities (F/B/I/A/E/J)."
  how: "text-embedding-004 per chunk with task_type RETRIEVAL_DOCUMENT; cosine distance."
  benchmark: "~100 chunks/s at typical quota; persisted to chroma_store/."
  example: "'primer coat thickness' query → top-5 tender chunks + top-5 IS-code chunks."
graph:
  title: "Stage 0d — Build knowledge graph"
  what: "Extract documents, clauses, entities, named quantities, and priority rules; assemble a NetworkX graph."
  why: "Categories G (priority conflict) and H (numeric inconsistency) are inherently cross-document; vector retrieval cannot see them."
  how: "LLM entity/quantity/priority-rule extraction per chunk; canonicalisation via surface-form aliasing; graph assembled with typed nodes and edges."
  benchmark: "G/H precision tracks directly with the quality of priority-rule extraction."
  example: "'GC section 5 shall prevail over drawings' becomes a PriorityRule node with dominant=GC, subordinate=drawings."
detect_v1:
  title: "Stage 1 — Detection pass v1 (positive-led)"
  what: "For every chunk × every category, ask the model: 'Identify spans that match category X in this clause.'"
  why: "v1 is the baseline detection signal — direct and recall-first."
  how: "Gemini 2.5 Flash with detection_{letter}.txt; returns DetectionPass records with span, confidence, justification."
  benchmark: "Recall-heavy by design; paired with v2/v3 to discipline precision."
  example: "v1 returns {span: 'adequate drainage', confidence: 0.82}."
detect_v2:
  title: "Stage 1 — Detection pass v2 (open-ended)"
  what: "'Review this clause for ambiguity. If any category-X issues exist, list them.'"
  why: "Open-ended framing reduces anchoring on the category name and catches different phrasings."
  how: "Gemini 2.5 Flash with detection_{letter}_v2.txt."
  benchmark: "Independent from v1; IoU clustering across v1/v2 drives the 2/3 agreement gate."
  example: "v2 also surfaces 'adequate drainage' → cluster with v1 (IoU=1.0)."
detect_v3:
  title: "Stage 1 — Detection pass v3 (adversarial)"
  what: "'A bidder and an engineer disagree on this clause. Could category X be the reason? List the spans.'"
  why: "Adversarial framing matches the operational definition of ambiguity and tends to catch edge cases."
  how: "Gemini 2.5 Flash with detection_{letter}_v3.txt."
  benchmark: "Usually the most conservative — agreement with v1/v2 lifts precision substantially."
  example: "v3 returns the same span → 3/3 agreement, cluster confirmed."
merge_probe:
  title: "Stage 1 — Merge + negative-control probe (G1, G2)"
  what: "IoU-cluster the three passes; confirm at ≥ 2/3; then probe 'could this NOT be category X?' and adjust confidence."
  why: "Guardrails G1 and G2 together deliver the precision uplift that makes the system publishable."
  how: "Spans clustered by IoU ≥ 0.5; probe reduces confidence by 0.2 on strong disagreement."
  benchmark: "The ensemble-on/off ablation quantifies the precision lift."
  example: "3/3 agreement, probe passed → confirmed with confidence 0.81."
resolve:
  title: "Stage 2 — Hybrid resolution"
  what: "For each confirmed flag, retrieve context (vector for F/B/I/A/E/J, graph for G/H) and ask the adjudicator: RESOLVED / PARTIALLY_RESOLVED / UNRESOLVED."
  why: "Resolution tells the user which flags they actually need to act on."
  how: "Router chooses retrieval path by category; Gemini 2.5 Pro adjudicates with resolution.txt or resolution_graph.txt."
  benchmark: "See verdict distributions."
  example: "Flag 'adequate drainage' + retrieved IS-code discharge table → PARTIALLY_RESOLVED."
judge_citations:
  title: "Stage 2 — LLM-as-judge citation verification (G3)"
  what: "Second LLM pass verifies the adjudicator's cited context IDs actually appear in the retrieved context block. Strips fabricated citations."
  why: "Adjudicator citation hallucination is the leading cause of false RESOLVED. The judge breaks that failure mode."
  how: "prompts/llm_judge_citation.txt, Gemini 2.5 Pro at temperature 0."
  benchmark: "Needs_re_adjudication rate typically 5–15%; surface this number in the metrics tab."
  example: "Adjudicator cites ctx_7; ctx_7 is in the block → kept. Cites ctx_22; not in block → stripped."
rewrite:
  title: "Stage 3 — IS-code-grounded rewrite"
  what: "For UNRESOLVED/PARTIAL flags, draft a replacement clause grounded in retrieved IS-code sections."
  why: "Gives the user something concrete to propose in a clarification — not 'fix this'."
  how: "Gemini 2.5 Pro with rewrite.txt; cites specific IS-code clause numbers present in the grounding block."
  benchmark: "INSUFFICIENT_GROUNDING when no IS-code anchor is found — honest non-rewrite."
  example: "Adds 'primer shall be IS 15546-compliant zinc chromate, DFT per IS …' (if grounding supports it)."
verify_grounding:
  title: "Stage 3 — Grounding verification (G4)"
  what: "Strips any IS-code reference in the rewrite that does not appear in the grounding block."
  why: "Prevents fabricated IS-code citations, which would be catastrophic for a thesis system."
  how: "Regex extract IS-code references from suggested text; intersect with citations in grounding block; strip orphans."
  benchmark: "Fabrication rate should be < 2% after verification."
  example: "Rewrite mentions 'IS 15546' present in grounding → kept. Mentions 'IS 999999' not in grounding → stripped → status downgraded to INSUFFICIENT_GROUNDING."
