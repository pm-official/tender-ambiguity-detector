ensemble_on_off:
  title: "Ensemble on/off"
  what: "Compare 3-pass ensemble vs single-pass detection."
  why: "Measures the precision lift from guardrail G1."
  how: "Run pipeline with DETECTION_AGREEMENT_THRESHOLD=2 (ensemble) vs with a single pass; report ΔP/R/F1."
  expected: "ΔPrecision +5–12 points; ΔRecall -1–4 points (net F1 positive)."
hybrid_retrieval:
  title: "Hybrid retrieval (vector+graph) vs vector only"
  what: "Turn off graph retrieval for G/H and re-run."
  why: "Quantifies the graph novelty claim."
  how: "Set GRAPH_CATEGORIES=[] and compare per-category F1 on G and H."
  expected: "G/H F1 falls sharply when graph is off (ideally >15 pts)."
detector_model:
  title: "Detector model choice"
  what: "Gemini 2.5 Flash vs Pro for detection."
  why: "Cost vs quality trade-off."
  how: "Swap DETECTION_MODEL; rerun."
  expected: "Pro ≈ Flash within ~2 F1 pts; Pro ~10× cost."
prompt_framing:
  title: "Prompt framing (v1 vs v2 vs v3)"
  what: "Turn on only one framing at a time."
  why: "Shows each framing's unique contribution."
  how: "Run with {v1}, {v2}, {v3}, and {v1,v2,v3}; compare."
  expected: "v3 (adversarial) lifts recall on E and G; v1 lifts precision."
keyword_baseline:
  title: "Keyword baseline"
  what: "Regex/keyword detector over published vague-word lists."
  why: "Reference lower bound."
  how: "baselines/keyword_baseline.py."
  expected: "F ≥ 0.3 precision, very low recall on G/H."
zero_shot_baseline:
  title: "Zero-shot LLM baseline"
  what: "Single Gemini Pro call with only the 8-category list, no per-category prompts."
  why: "Tests whether domain-tuned prompts matter."
  how: "baselines/zero_shot_llm.py."
  expected: "~10–20 F1 pts below the tuned ensemble."
guardrail_g1:
  title: "Guardrail G1 off (no ensemble)"
  what: "Same as ensemble_on_off, reported under the guardrail heading for completeness."
  why: ""
  how: ""
  expected: ""
guardrail_g2:
  title: "Guardrail G2 off (no negative probe)"
  what: "Skip the negative-control probe."
  why: "Measures contribution of the per-flag probe to precision."
  how: "Set DISABLE_NEG_PROBE=1."
  expected: "Modest precision drop on F and B."
guardrail_g3:
  title: "Guardrail G3 off (no citation judge)"
  what: "Skip LLM-as-judge citation verification."
  why: "Measures contribution to false_resolution_rate."
  how: "Set DISABLE_CITATION_JUDGE=1."
  expected: "FRR rises ~3–8 pts."
guardrail_g4:
  title: "Guardrail G4 off (no grounding verification)"
  what: "Skip rewrite grounding verification."
  why: "Measures IS-code hallucination rate."
  how: "Set DISABLE_GROUND_VERIFY=1."
  expected: "IS-code-fabrication rate rises sharply."
annotation_protocol:
  title: "Annotation protocol vs human-only gold"
  what: "Compare protocol gold to a 50-flag fully-human subset."
  why: "Defends the LLM-as-judge annotation approach."
  how: "src/iaa.py compute kappa."
  expected: "kappa ≥ 0.70 (substantial)."
