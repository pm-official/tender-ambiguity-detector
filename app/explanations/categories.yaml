F:
  display_name: "Undefined Terms"
  title: "Undefined Terms"
  short: "Engineering noun phrases with no definition and multiple interpretations."
  what: "A noun phrase carrying engineering or contractual significance whose meaning is not pinned down in the clause or surrounding chunk, and where competent readers could plausibly disagree."
  why: "Undefined terms create scope arguments during execution and bidding — one party reads a stricter meaning, the other a looser one, and cost/quality decisions diverge."
  how: "The detector looks for noun phrases that (a) carry engineering/contractual weight and (b) have no definitional anchor in the clause (no 'as defined in', no quantified specification). Generic English nouns are ignored."
  benchmark: "Positive: 'suitable aggregate', 'standard finish', 'approved make'. Negative: 'concrete of grade M25' (grade anchors meaning)."
  example: "'Contractor shall use suitable aggregate for the subbase.' — 'suitable aggregate' has no grading or IS reference, so interpretations diverge."
B:
  display_name: "Vague Qualifiers"
  title: "Vague Qualifiers"
  short: "Evaluative adjectives used as criteria with no quantifiable threshold."
  what: "An evaluative adjective used as an acceptance criterion without a quantifiable threshold."
  why: "Qualitative adjectives cannot be tested against a spec, so acceptance becomes a matter of subjective judgement and later dispute."
  how: "The detector finds adjectives like adequate/reasonable/sufficient/good when they modify a testable noun (drainage, tolerance, finish, quality) and the clause gives no numeric or standard-referenced threshold."
  benchmark: "Positive: 'adequate drainage', 'reasonable tolerance'. Negative: 'drainage capacity >= 50 l/s/ha' (quantified)."
  example: "'Provide adequate drainage around the foundation.' — 'adequate' has no threshold."
I:
  display_name: "Unnamed References"
  title: "Unnamed References"
  short: "References to documents, clauses, drawings, or standards where the target is not named."
  what: "A reference to a document, clause, schedule, drawing, or standard where the target itself is not identified."
  why: "A dangling reference cannot be resolved during bidding or execution — it forces the contractor to guess which standard/drawing applies."
  how: "The detector finds anaphoric reference patterns ('as per the relevant IS code', 'refer to the drawing', 'per the schedule') where the pointed-to object has no name or number."
  benchmark: "Positive: 'as per the relevant IS code'. Negative: 'as per IS 456:2000'."
  example: "'The contractor shall comply with the relevant safety code.' — which code?"
A:
  display_name: "Word-Level Ambiguity"
  title: "Word-Level Ambiguity"
  short: "Construction words that carry more than one meaning in context."
  what: "A word used where multiple established construction-domain meanings fit the context."
  why: "Same word, different meaning in different subcontracts or specs, can cause direct execution errors."
  how: "The detector knows a small set of known polysemous construction terms (fair, access, block, level, grade, etc.) and triggers only when the local context doesn't disambiguate."
  benchmark: "Positive: 'fair-faced finish' (aesthetic vs cost-sharing). Negative: 'fair-face concrete per IS 10262' (anchored)."
  example: "'Contractor shall have access to site.' — physical access or rights-of-access?"
E:
  display_name: "Unclear Pronouns"
  title: "Unclear Pronouns"
  short: "Pronouns or definite references whose antecedent is not unambiguous."
  what: "A pronoun or definite reference whose antecedent is not uniquely identifiable."
  why: "'They', 'it', 'the party' can refer to either of two entities in a sentence — one of the commonest dispute sources."
  how: "The detector looks for pronouns or definite noun phrases following sentences that introduce multiple eligible antecedents, and checks whether the grammatical context disambiguates."
  benchmark: "Positive: 'Contractor shall coordinate with supplier. They shall provide materials.' — who is 'they'? Negative: 'Contractor shall coordinate with supplier. The contractor shall provide materials.'"
  example: "'The engineer shall confirm with the contractor. He shall approve the design.' — he = engineer or contractor?"
G:
  display_name: "Priority Conflicts"
  title: "Priority Conflicts"
  short: "Cross-document conflicts that the document hierarchy does not resolve."
  what: "A clause asserts a priority/precedence rule between two documents, but on the specific point at hand the two documents disagree and the priority rule does not cleanly resolve it."
  why: "Priority-of-documents clauses are boilerplate in tenders. When an actual conflict surfaces, the rule is supposed to decide — when it cannot, the dispute is immediate."
  how: "Graph retrieval: the knowledge graph stores priority rules and cross-document edges. The detector asks the LLM 'does the priority rule resolve the conflict between chunk X and chunk Y?'. If no, raise a Priority Conflict."
  benchmark: "Positive: priority says BOQ > drawings, but BOQ is silent on the item while drawings show two conflicting values. Negative: priority says drawings > BOQ and drawings clearly specify the item."
  example: "General Conditions say '15% contingency'; Particular Conditions say '10%'; priority clause does not list these in order."
H:
  display_name: "Numerical Inconsistencies"
  title: "Numerical Inconsistencies"
  short: "Same quantity named differently in different documents with different values."
  what: "Same named quantity appears with different values in different parts of the tender, with no reconciliation clause."
  why: "Direct risk of cost or scope mistake. Silent inconsistencies are the leading cause of quantity disputes."
  how: "Graph retrieval: named quantities are extracted, canonicalised, linked to source chunks, and compared across documents. A value mismatch with no reconciliation clause raises a Numerical Inconsistency."
  benchmark: "Positive: 'concrete 1200 m3' in BOQ vs 'concrete 1500 m3' in specifications. Negative: both say 1200 m3."
  example: "'Total works: Rs 4.5 crore (Schedule A); Rs 4.8 crore (Summary)'."
J:
  display_name: "Incomplete Specifications"
  title: "Incomplete Specifications"
  short: "Procedures that prescribe an action but omit a parameter needed to execute."
  what: "A procedural clause prescribing an action/material but omitting at least one parameter needed to execute or test it."
  why: "Incomplete procedures are the main source of on-site discretion, which leads to variance between contractors and disputes over whether a step was correctly performed."
  how: "The detector applies a per-category parameter checklist: coating clauses need type+thickness+cure; concrete clauses need grade+slump+cover; etc. Missing parameters raise an Incomplete Specification flag with the specific gap cited."
  benchmark: "Positive: 'apply primer coat on cleaned surface' (no type/thickness/cure). Negative: 'apply zinc chromate primer, 40 micron DFT, 4 hr cure'."
  example: "'The joints shall be sealed with sealant of approved type.' — which sealant? bead width? tooling?"
