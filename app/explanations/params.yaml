DETECTION_MODEL:
  title: "Detection model"
  what: "Gemini 2.5 Flash — used for every detection pass."
  why: "Detection is many small calls per chunk; Flash is fast, cheap, and accurate enough given the 3-pass ensemble."
  how: "Set in src/config.py."
  benchmark: "Running the ensemble with Flash is ~1/10th the cost of Pro and empirically matches it within ~2 F1 pts."
  example: "gemini-2.5-flash"
ADJUDICATION_MODEL:
  title: "Adjudication model"
  what: "Gemini 2.5 Pro — used to decide RESOLVED / PARTIAL / UNRESOLVED."
  why: "Adjudication is a single call per flag but must reason over multiple retrieved chunks — Pro helps."
  how: "Set in src/config.py."
  benchmark: "Pro-vs-Flash for adjudication is one of the ablations."
  example: "gemini-2.5-pro"
JUDGE_MODEL:
  title: "Judge model"
  what: "Gemini 2.5 Pro — verifies the adjudicator's citations and runs the annotation-protocol judge pass."
  why: "The judge is a precision-critical step; Pro's stronger instruction-following matters here."
  how: "Set in src/config.py."
  benchmark: ""
  example: "gemini-2.5-pro"
REWRITE_MODEL:
  title: "Rewrite model"
  what: "Gemini 2.5 Pro — writes the suggested rewrite grounded in IS-code text."
  why: "Rewrite is the most user-visible output; Pro's fluency and reasoning pay off."
  how: "Set in src/config.py."
  benchmark: ""
  example: "gemini-2.5-pro"
EMBEDDING_MODEL:
  title: "Embedding model"
  what: "Google text-embedding-004 — 768-dim, cosine."
  why: "Strong multilingual embedding, well-suited to English-dominant Indian tender text with occasional Hindi."
  how: "Used via google-generativeai, stored in ChromaDB."
  benchmark: ""
  example: "text-embedding-004"
TOP_K_TENDER:
  title: "TOP_K_TENDER"
  what: "Number of same-tender chunks retrieved for each flag during resolution."
  why: "Large K dilutes relevance; small K misses context. 5 is the tuned default."
  how: "Set in config.py; used by resolver."
  benchmark: "3–8 range; 5 empirically optimal."
  example: "TOP_K_TENDER = 5"
TOP_K_ISCODE:
  title: "TOP_K_ISCODE"
  what: "Number of IS-code chunks retrieved for each flag."
  why: "IS-code grounding is sparse; 5 is enough while keeping the context window small."
  how: "Set in config.py."
  benchmark: "3–8 range."
  example: "TOP_K_ISCODE = 5"
CHUNK_MAX_TOKENS:
  title: "CHUNK_MAX_TOKENS"
  what: "Maximum tokens per chunk before a new chunk starts."
  why: "500 is the sweet spot for detection latency vs clause coherence."
  how: "Greedy packing; see src/chunker.py."
  benchmark: "300–700 range."
  example: "500"
CHUNK_OVERLAP:
  title: "CHUNK_OVERLAP"
  what: "Tokens of overlap between consecutive chunks so clause boundaries don't split mid-sentence."
  why: "Reduces cross-boundary miss; too large wastes context."
  how: "Tail-append previous chunk's last N tokens."
  benchmark: "30–80 range."
  example: "50"
DETECTION_AGREEMENT_THRESHOLD:
  title: "DETECTION_AGREEMENT_THRESHOLD"
  what: "Minimum number of ensemble passes that must agree on a span for it to be confirmed."
  why: "2-of-3 is the precision-first default. 1-of-3 clusters go to the review queue."
  how: "Applied after IoU clustering in detector.merge_clusters."
  benchmark: "The ensemble-on/off ablation quantifies the impact."
  example: "2"
SPAN_IOU_THRESHOLD:
  title: "SPAN_IOU_THRESHOLD"
  what: "Character-span IoU at which two detection passes are considered to refer to the same flag."
  why: "0.5 allows small alignment differences without merging unrelated spans."
  how: "Pairwise IoU → greedy clustering."
  benchmark: "0.4–0.6 range."
  example: "0.5"
KEYWORD_SCORE_WEIGHT_ALPHA:
  title: "Keyword weight (α)"
  what: "Weight of the keyword score in the combined score. (1-α) is the LLM weight. Default 0.3."
  why: "Controls the blend between fast/transparent keyword signal and broader LLM signal. The alpha_sweep ablation measures the cost of each extreme."
  how: "Configured in config.py; user-tunable in the sidebar; swept 0.0 → 1.0 in the alpha_sweep ablation."
  benchmark: "0.2-0.4 is the sweet spot for most categories on our calibration slice."
  example: "α = 0.3 → 30% keyword + 70% LLM."
DETECTION_THRESHOLD:
  title: "Detection threshold"
  what: "Minimum combined score (0-1) for a chunk to be flagged. Default 0.5; per-category after calibration."
  why: "Higher threshold → fewer false positives, lower recall."
  how: "Set in config.py; per-category overrides loaded from output/calibration.json."
  benchmark: "Typical post-calibration band 0.40-0.65."
  example: "Set Vague Qualifiers threshold to 0.55 to suppress noise on a boilerplate-heavy GCC."
USE_LEGACY_ENSEMBLE:
  title: "Use legacy 3-pass ensemble"
  what: "Feature flag that routes detection through the Prompt-3 3-pass ensemble instead of the dual-scoring path."
  why: "Preserves the old detector so the dual-scoring-vs-ensemble ablation can still run."
  how: "config.USE_LEGACY_ENSEMBLE = True, or pass use_legacy=True to detect()."
  benchmark: ""
  example: "Used only by the ablation runner."
PACKAGE_DOCUMENT_TYPES:
  title: "Package document types"
  what: "The fixed vocabulary a user can tag each uploaded PDF with."
  why: "Downstream retrieval can filter by document type, and explanations (document_types.yaml) render per-type tips."
  how: "Defined in config.PACKAGE_DOCUMENT_TYPES."
  benchmark: ""
  example: "GCC / NIT / Technical Specifications / BOQ / Drawing / Addendum / Additional Conditions / Conditions of Contract / Other."
DETECTION_CONFIDENCE_THRESHOLD:
  title: "Per-category confidence threshold"
  what: "Calibration-tuned per-category minimum mean_confidence for a cluster to be kept as a confirmed flag."
  why: "Some categories are naturally noisier — calibration optimises F1 per category."
  how: "Set per-category by sweep over the held-out slice; written to output/calibration.json."
  benchmark: "Typical range 0.45–0.65."
  example: "F: 0.55 (default); post-calibration may change per tender corpus."
RANDOM_SEED:
  title: "Random seed"
  what: "Fixed seed for every stochastic step — embedding order, cluster tie-breaking, etc."
  why: "Reproducibility. LLM stochasticity is mitigated by temperature 0 and the seed pins everything else."
  how: "src/config.RANDOM_SEED = 1729."
  benchmark: ""
  example: "1729"
ENABLED_CATEGORIES:
  title: "Enabled categories"
  what: "Which of F, B, I, A, E, G, H, J the detector will run."
  why: "Let the user disable noisy categories on tenders where they don't apply."
  how: "Passed to detector.detect()."
  benchmark: ""
  example: "[F, B, I, A, E, G, H, J]"
GRAPH_CATEGORIES:
  title: "Graph-routed categories"
  what: "Categories that the resolver sends to the graph retriever instead of vector retrieval."
  why: "G and H are cross-document/structural — only the graph can surface them."
  how: "Router in src/resolver.py."
  benchmark: ""
  example: "[G, H]"
