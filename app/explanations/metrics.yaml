precision:
  title: "Precision"
  what: "Of the flags the system raised, what fraction are genuine ambiguities (per the gold set)."
  why: "Precision is how much the user can trust a flag. Low precision means the system cries wolf — professional users stop reading after the third false flag."
  how: "precision = TP / (TP + FP). A flag is TP if it IoU-matches a gold flag of the same category at IoU ≥ 0.5."
  benchmark: "Thesis target ≥ 0.75 per category. Below 0.60 the system is noisy. 0.75–0.85 is the publishable band."
  example: "System raised 20 F-flags; 16 match the gold; precision_F = 16/20 = 0.80."
recall:
  title: "Recall"
  what: "Of the genuine ambiguities in the gold set, what fraction did the system catch."
  why: "Recall is completeness. A high-precision system that misses most real ambiguities is still not useful for tender review."
  how: "recall = TP / (TP + FN). A gold flag is counted as found if some predicted flag IoU-matches it (same category, IoU ≥ 0.5)."
  benchmark: "Thesis target ≥ 0.70 per category. Below 0.60 means the detection prompts need revision."
  example: "Gold has 25 F-flags; system caught 18; recall_F = 18/25 = 0.72."
f1:
  title: "F1"
  what: "Harmonic mean of precision and recall. The single summary number reviewers ask for first."
  why: "F1 balances false alarms and misses. A system that is 1.0 precise and 0.1 recall has F1 ≈ 0.18 — and that is honest."
  how: "F1 = 2·P·R / (P + R)."
  benchmark: "≥ 0.72 per category is the publishable band given the precision/recall targets."
  example: "P=0.80, R=0.72 → F1 = 2·0.80·0.72 / (1.52) = 0.758."
false_resolution_rate:
  title: "False-resolution rate"
  what: "Of verdicts stamped RESOLVED, what fraction were wrong — i.e. the ambiguity was not actually cleared by the cited context."
  why: "This is the single most dangerous failure mode. A false RESOLVED hides a real ambiguity and gives a false sense of safety."
  how: "Manual audit (spot-check) + LLM-as-judge pass on a stratified sample. Rate = wrong_RESOLVED / total_RESOLVED."
  benchmark: "Must be ≤ 10%. At 15%+ the RESOLVED label itself is untrustworthy and must be reframed."
  example: "100 resolutions stamped RESOLVED; 7 were audited as wrong → 7%."
kappa:
  title: "Cohen's kappa (inter-annotator agreement)"
  what: "Agreement between two annotators (or annotator vs protocol gold) corrected for chance."
  why: "A pure percent-agreement number is inflated because many spans are obvious. Kappa measures agreement beyond chance and is the community standard."
  how: "kappa = (p_o − p_e) / (1 − p_e), where p_o is observed agreement and p_e is expected chance agreement."
  benchmark: "Landis-Koch: 0.21–0.40 fair; 0.41–0.60 moderate; 0.61–0.80 substantial; >0.80 almost perfect."
  example: "50-flag subset; annotator vs gold agreed on 43; kappa ≈ 0.78 → substantial."
graph_retrieval_recall:
  title: "Graph retrieval recall (G/H)"
  what: "Of gold conflicts in categories G (priority) and H (numeric), what fraction were surfaced by the graph retriever."
  why: "G and H cannot be caught by vector retrieval alone — they are inherently cross-document structural conflicts. This metric is the novelty-of-graph claim, measured."
  how: "For each gold G or H, ask the graph retriever to fetch candidate conflicts; count hit if the retrieved set contains a conflict matching the gold at the entity/quantity level."
  benchmark: "Target ≥ 0.75. Below that, the graph schema or priority-rule extraction is too thin."
  example: "Gold has 8 H-conflicts across 3 tenders; graph surfaced 7 → 7/8 = 0.875."
agreement_rate:
  title: "Detection-ensemble agreement rate"
  what: "Fraction of the three detection passes (v1/v2/v3) that voted for this specific flag."
  why: "Agreement rate is the primary in-app confidence signal: 3/3 means all three framings converged; 2/3 means it passed the gate but one pass disagreed; 1/3 means it is in the review queue."
  how: "After IoU clustering (IoU ≥ 0.5) across the three passes, agreement_rate = cluster_size / 3."
  benchmark: "Only 3/3 and 2/3 clusters are confirmed. 1/3 clusters go to the review queue for human spot-check."
  example: "v1 and v3 flagged 'adequate drainage' (IoU ≥ 0.5); v2 did not; agreement_rate = 0.67, status = CONFIRMED."
mean_confidence:
  title: "Mean confidence"
  what: "Average of the self-reported confidence scores from the detection passes that voted for this flag, optionally reduced by the negative probe."
  why: "Confidence lets you rank flags when you have a triage budget — read 0.85-confidence flags first."
  how: "mean of confidences across agreeing passes; if the negative-control probe strongly disagrees, subtract 0.2."
  benchmark: "Interpret with agreement_rate. A 3/3 cluster at 0.55 is often realer than a 1/3 cluster at 0.90."
  example: "Two agreeing passes @ 0.82 and 0.75; probe fine → mean_confidence = 0.785."
keyword_vs_llm_contribution:
  title: "Keyword vs LLM contribution"
  what: "Per category, the fraction of confirmed flags where the keyword signal dominated (α·keyword > (1-α)·llm) versus where the LLM signal dominated."
  why: "Tells you whether the lexicon is carrying its weight. 100% LLM-dominant means the lexicon is probably under-curated."
  how: "For every confirmed flag, compare α·keyword vs (1-α)·llm; tally into Keyword-led / LLM-led buckets per category."
  benchmark: "Healthy split is roughly 20-40% keyword-led for F, B, J, I; near 0% for G, H (graph-routed)."
  example: "Vague Qualifiers: 35% keyword-led, 65% LLM-led — lexicon pulling reasonable weight."
resolved_by_context_rate:
  title: "Resolved-by-context rate"
  what: "Share of Stage-1 confirmed flags that Stage 2 marked Resolved by Context."
  why: "A healthy positive rate means Stage 2 is doing real work. A zero rate means Stage 2 is permissive (everything gets Confirmed) or the package is internally inconsistent."
  how: "resolved_by_context / (confirmed at Stage 1). The UI breaks it out per category."
  benchmark: "25-45% typical for well-prepared packages."
  example: "50 flags at Stage 1; 17 resolved by context → 34% rate."
retrieval_hit_at_3:
  title: "hit@3 — standards retrieval quality"
  what: "Fraction of hand-crafted questions (gold/standards_qa.jsonl) for which the top-3 retrieved standards chunks contain the expected clause."
  why: "A rewrite can only be grounded if the retriever can find the right IS-code / CPWD clause. hit@3 is the direct upstream quality signal for Stage 3."
  how: "For each of the 32 gold questions, run query_standards with top_k=3. The question is a hit if any retrieved chunk contains the expected source code (e.g. 'IS 456:2000'). Rate = hits / total."
  benchmark: "Operational gate: >= 0.70 on our 32-question gold set. <0.60 means the corpus is under-populated or the embedding model is mismatched to the domain."
  example: "32 questions, 25 hits at top-3 => hit@3 = 0.78."
retrieval_score:
  title: "Retrieval similarity score"
  what: "Cosine similarity between the query embedding and the retrieved chunk embedding."
  why: "Tells you whether the resolver actually had relevant context. A high-score context that still doesn't resolve is more informative than a miss."
  how: "1 − cosine-distance from ChromaDB query. Cosine in [−1, 1]; here we clip to [0, 1]."
  benchmark: "≥ 0.55 is typically 'topically relevant' for tender text; ≥ 0.75 is 'very close'."
  example: "Resolver query 'primer coat thickness' → retrieved IS-code section @ 0.81 — high quality context."
