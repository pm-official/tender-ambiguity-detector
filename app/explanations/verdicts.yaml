CONFIRMED_AMBIGUOUS:
  display_name: "Confirmed Ambiguous"
  title: "Confirmed Ambiguous"
  what: "The retrieval over the whole tender package did not clear the flag — a reasonable bidder could still read the clause two different ways."
  why: "Confirmed flags are the items the user must act on: raise a clarification, propose a rewrite, or absorb the risk. The Stage-3 rewriter runs only on these."
  how: "Adjudicator sees flag + package-wide retrieved context and judges that the context does not resolve the reading. LLM-as-judge verifies the citations before the verdict is trusted."
  benchmark: "In a healthy pipeline, 40-60% of flags end here. >80% means Stage 2 is under-recalling context; <20% means Stage 1 is over-flagging."
  example: "Flag: 'approved make'. Package retrieval returns boilerplate only → Confirmed Ambiguous."
RESOLVED_BY_CONTEXT:
  display_name: "Resolved by Context"
  title: "Resolved by Context"
  what: "Retrieval found text elsewhere in the tender package (different document or section) that names, defines, or specifies the flagged term well enough that only one interpretation remains."
  why: "This is the methodology's signature output: an ambiguity that looks ambiguous in one paragraph is often disambiguated somewhere else in the same tender. Surfacing this stops false alarms."
  how: "Adjudicator sees the flag plus package-wide context and decides the context fully clears the ambiguity; LLM-as-judge verifies citations."
  benchmark: "25-45% typical. A very high rate means Stage 2 is doing real work and the package is internally consistent."
  example: "Flag: 'apply primer'. Retrieval returns a Specifications section saying 'primer shall be zinc chromate, 40 um DFT, 4 hr cure' → Resolved by Context."
PARTIALLY_RESOLVED:
  display_name: "Partially Resolved"
  title: "Partially Resolved"
  what: "Some of the gap is closed by retrieval, but at least one parameter or meaning remains open."
  why: "Honest middle verdict — avoids the binary false choice of Confirmed / Resolved."
  how: "Adjudicator returns PARTIALLY_RESOLVED with a list of what is answered and what isn't. Rewrite may still run (optional)."
  benchmark: "10-25% typical."
  example: "Primer type fixed by retrieval, but thickness and cure time not mentioned anywhere."
