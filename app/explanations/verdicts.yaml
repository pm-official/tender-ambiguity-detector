RESOLVED:
  title: "RESOLVED"
  what: "The retrieved tender/IS-code context makes the flagged span's meaning definite — no reasonable disagreement remains."
  why: "RESOLVED means 'do not bother — the spec answers this elsewhere'. It removes noise from the review list without discarding the flag."
  how: "The LLM adjudicator sees the flag + retrieved contexts and decides the context answers the specific gap. A second LLM-as-judge verifies the cited context IDs actually exist in the retrieved block."
  benchmark: "In a healthy pipeline, 25–45% of flags resolve. >70% resolved suggests the detector is too aggressive."
  example: "Flag: 'apply primer'. Retrieval returns 'Section 4.2: primer shall be zinc chromate, 40 µm DFT, 4 hr cure.' → RESOLVED."
PARTIALLY_RESOLVED:
  title: "PARTIALLY RESOLVED"
  what: "Some of the flagged gap is clarified by retrieval, but at least one required parameter or meaning remains open."
  why: "Honest middle verdict. Avoids the binary false choice of RESOLVED / UNRESOLVED, which forces the model to lie one way or the other."
  how: "Adjudicator is explicitly allowed to return PARTIAL with a list of what is answered and what still isn't."
  benchmark: "10–25% typical."
  example: "Primer type fixed by retrieval, but thickness and cure time not mentioned anywhere."
UNRESOLVED:
  title: "UNRESOLVED"
  what: "Retrieval surfaces no clarifying context — the ambiguity persists."
  why: "UNRESOLVED flags are the ones the user must address — either by a clarification request to the authority or by a rewrite. This is the most important output of the pipeline."
  how: "Either the retriever returned nothing relevant (low scores) or the adjudicator judged the context insufficient."
  benchmark: "40–60% unresolved is expected for tenders with genuine ambiguity."
  example: "Flag: 'approved make'. Retrieval returns unrelated boilerplate; UNRESOLVED."
